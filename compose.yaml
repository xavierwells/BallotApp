name: whats-on-my-ballot

services:
  web:
    build:
      context: ./apps/web
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: development
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ballot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ballot}
      DOCUMENT_STORAGE_BACKEND: ${DOCUMENT_STORAGE_BACKEND:-filesystem}
      DOCUMENT_STORAGE_ROOT: ${DOCUMENT_STORAGE_ROOT:-/var/lib/ballot/documents}
      AUTHORITY_MANIFEST_PATH: /app/data/authorities/copperas-cove-pilot.json
      GEOCODER_PROVIDER: ${GEOCODER_PROVIDER:-disabled}
      GEOCODER_TIMEOUT_SECONDS: ${GEOCODER_TIMEOUT_SECONDS:-5}
      BALLOT_RESOLUTION_PUBLICATION_ID: ${BALLOT_RESOLUTION_PUBLICATION_ID:-}
      BALLOT_RESOLUTION_ELECTION_ID: ${BALLOT_RESOLUTION_ELECTION_ID:-}
      BALLOT_RESOLUTION_ELECTION_DATE: ${BALLOT_RESOLUTION_ELECTION_DATE:-}
      BALLOT_RESOLUTION_DEMO_ENABLED: ${BALLOT_RESOLUTION_DEMO_ENABLED:-false}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - document_data:/var/lib/ballot/documents
      - ./data/authorities:/app/data/authorities:ro
      - ./data/boundaries:/app/data/boundaries:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: ./apps/api
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ballot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ballot}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ballot}
      POSTGRES_USER: ${POSTGRES_USER:-ballot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18+ manages major-version-specific data directories below
      # this path.  Mounting the parent preserves the image's supported layout.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ballot} -d ${POSTGRES_DB:-ballot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  document_data:
