apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: api
          image: registry.example.com/whats-on-my-ballot-api
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: production
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: public-runtime
                  key: CORS_ALLOWED_ORIGINS
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - port: 8080
      targetPort: 8080
